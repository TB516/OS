name: Update dependencies

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ steps.bot.outputs.token }}
          renovate-version: 44.222.5

      - name: Report kernel changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        timeout-minutes: 10
        env:
          BOT_LOGIN: ${{ steps.bot.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const path = `${process.env.GITHUB_WORKSPACE}/scripts/kernel-report.ts`;
            const { default: report } = await import(path);
            await report({ github, context, core });
