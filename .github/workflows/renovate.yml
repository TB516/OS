name: Update dependencies

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.171.1

      - name: Report kernel changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        timeout-minutes: 10
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          script: |
            const path = `${process.env.GITHUB_WORKSPACE}/scripts/kernel-report.ts`;
            const { default: report } = await import(path);
            await report({ github, context, core });
