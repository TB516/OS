name: Update dependencies

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        env:
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.191.0

      - name: Report kernel changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        timeout-minutes: 10
        with:
          github-token: ${{ secrets.RENOVATE_TOKEN }}
          script: |
            const path = `${process.env.GITHUB_WORKSPACE}/scripts/kernel-report.ts`;
            const { default: report } = await import(path);
            await report({ github, context, core });
