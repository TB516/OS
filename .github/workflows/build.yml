name: Build OS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - buildstream.conf
      - project.conf
      - elements/**
      - files/**
      - include/**
      - patches/**
      - scripts/bst

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      IMAGE_NAME: tb516/os
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image version
        id: image
        env:
          REGISTRY_CREDENTIALS: "${{ github.actor }}:${{ github.token }}"
        run: |
          build_date="$(date --utc +%Y%m%d)"
          build_number="$(
            skopeo list-tags --creds "$REGISTRY_CREDENTIALS" \
              "docker://ghcr.io/$IMAGE_NAME" | \
              jq --arg prefix "$build_date." \
                '[.Tags[] | select(startswith($prefix)) | ltrimstr($prefix) | tonumber] | (max // 0) + 1'
          )"
          image_version="$build_date.$build_number"

          sed -i "s/^  image-version:.*$/  image-version: '$image_version'/" include/image.yml
          grep -Fxq "  image-version: '$image_version'" include/image.yml
          echo "IMAGE_VERSION=$image_version" >> "$GITHUB_ENV"
          echo "version=$image_version" >> "$GITHUB_OUTPUT"
          echo "Building Personal OS $image_version"

      - name: Free runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          extra-squeeze: true

      - name: Prepare BuildStream
        run: |
          sudo modprobe fuse
          # Ubuntu restricts unprivileged namespaces used by BuildStream/bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          podman pull "$(cat include/builder-image.txt)"

      - name: Build image
        run: ./scripts/bst --builders 1 --max-jobs 4 --cache-buildtrees never build oci/image.bst

      - name: Export image
        run: ./scripts/bst artifact checkout --directory build/image oci/image.bst

      - name: Split image into reusable layers
        run: |
          skopeo copy oci:build/image "containers-storage:localhost/$IMAGE_NAME:unchunked"
          CHUNKAH_CONFIG_STR="$(podman inspect "localhost/$IMAGE_NAME:unchunked")"
          export CHUNKAH_CONFIG_STR
          # Keep layer timestamps stable across builds.
          podman run --rm \
            --mount "type=image,src=localhost/$IMAGE_NAME:unchunked,target=/chunkah" \
            -v "$PWD/build:/out" \
            -e CHUNKAH_CONFIG_STR -e SOURCE_DATE_EPOCH=1321009871 \
            "$(cat include/chunkah-image.txt)" \
            build --max-layers 128 --output oci:/out/chunked
          skopeo copy oci:build/chunked "containers-storage:localhost/$IMAGE_NAME:sha-$GITHUB_SHA"

      - name: Validate bootc image
        run: |
          podman run --rm --pull=never "localhost/$IMAGE_NAME:sha-$GITHUB_SHA" bootc container lint
          podman tag "localhost/$IMAGE_NAME:sha-$GITHUB_SHA" "localhost/$IMAGE_NAME:latest"
          podman tag "localhost/$IMAGE_NAME:sha-$GITHUB_SHA" "localhost/$IMAGE_NAME:$IMAGE_VERSION"

      - name: Publish image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: sha-${{ github.sha }} ${{ steps.image.outputs.version }} latest
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
