name: personal-os
min-version: 2.6
element-path: elements

(@):
- gnome.bst:freedesktop-sdk.bst:include/runtime.yml
- include/image.yml

options:
  arch:
    type: arch
    description: Target architecture
    variable: arch
    values: [x86_64]

sandbox:
  build-arch: '%{arch}'

aliases:
  gnome: https://gitlab.gnome.org/GNOME/
  github: https://github.com/
  docker: https://registry-1.docker.io/
  ghcr: https://ghcr.io/
  gitlab: https://gitlab.com/

plugins:
# The pinned builder provides Git support to fetch the plugin junctions.
- origin: pip
  package-name: buildstream-plugins
  sources: [git]
- origin: junction
  junction: plugins/buildstream-plugins.bst
  sources: [patch, docker]
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  sources: [git_repo, patch_queue]
- origin: junction
  junction: gnome.bst
  elements: [collect_initial_scripts]

fatal-warnings:
- overlaps
- unaliased-url
- unstaged-files
